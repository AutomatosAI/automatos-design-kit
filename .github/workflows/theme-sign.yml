name: Theme sign

# PRD-261 C-03a (D3-c, 19 Oct): signs an approved Marketplace theme version. Approving a version in
# the admin queue records a signature request; a person runs this workflow with the request's
# payload {id, version, digest, files} (or the whole request the queue shows), then pastes the
# printed signature into the admin queue (POST /api/admin/themes/{id}/signature). The Ed25519 key
# is this repository's THEME_SIGNING_KEY secret, read by the one signing step and nowhere else; it
# is never on the orchestrator. Nothing is installed: no package from npm runs next to the key.
# Verifying signatures is C-05, after WebSummit.

on:
  workflow_dispatch:
    inputs:
      request:
        description: "The signature request JSON from the admin queue: {id, version, digest, files}"
        required: true
        type: string

permissions: {}

concurrency:
  group: theme-sign
  cancel-in-progress: false

jobs:
  sign:
    name: Sign a theme version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # The request reaches the script through env only. The script refuses when the secret is
      # absent, the request is malformed, or its file hashes don't add up to its digest.
      - name: Sign
        env:
          SIGN_REQUEST: ${{ inputs.request }}
          THEME_SIGNING_KEY: ${{ secrets.THEME_SIGNING_KEY }}
        run: node scripts/sign/cli.ts
