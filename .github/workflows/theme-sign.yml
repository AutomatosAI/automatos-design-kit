name: Theme sign

# PRD-261 C-03a (D3-c, 19 Oct): signs an approved Marketplace theme version. Approving a version in
# the admin queue records a signature request; a person runs this workflow with the whole request
# the queue shows ({requestId, payload, payloadSha256, canonical, ...}; payload is {id, version,
# digest, files}, and only the payload is signed, as core's signing.py signs it), then pastes the
# printed request id and signature into the admin queue (POST /api/admin/themes/{id}/signature).
# The script refuses an id or version outside core's manifest patterns, a requestId that isn't a
# UUID, and any output line holding a line break or "::". The Ed25519 key
# is THEME_SIGNING_KEY, an ENVIRONMENT secret of the 'theme-signing' environment, read by the one
# signing step and nowhere else; it is never on the orchestrator. Nothing is installed: no package
# from npm runs next to the key. The run also prints the key id and the one-line .sig.json
# envelope to keep next to the package (C-05m); scripts/sign/verify.ts checks an envelope against
# the package and keys/theme-signing.json, and core verifies the pasted signature (C-05a, C-05b).
#
# workflow_dispatch can be started on any branch, and a branch could change scripts/sign/cli.ts.
# So the job runs only on main, and the key lives in the 'theme-signing' environment, whose
# deployment-branch rule must allow main only (Settings > Environments > theme-signing).
# GitHub then releases the secret to main's own code and to nothing else.
#
# The branch rule alone lets anyone who can run workflows sign. So 'theme-signing' must ALSO have
# required reviewers: the named signers only, with "Prevent self-review" on, so the person who
# starts a run can't approve its use of the key. Each run then waits for a second signer.

on:
  workflow_dispatch:
    inputs:
      request:
        description: "The whole signature request JSON from the admin queue: {requestId, payload, payloadSha256, canonical, ...}"
        required: true
        type: string

permissions: {}

concurrency:
  group: theme-sign
  cancel-in-progress: false

jobs:
  sign:
    name: Sign a theme version
    if: github.ref == 'refs/heads/main'
    environment: theme-signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # The request reaches the script through env only. The script refuses when the secret is
      # absent, the request is malformed, or its file hashes don't add up to its digest.
      - name: Sign
        env:
          SIGN_REQUEST: ${{ inputs.request }}
          THEME_SIGNING_KEY: ${{ secrets.THEME_SIGNING_KEY }}
        run: node scripts/sign/cli.ts
