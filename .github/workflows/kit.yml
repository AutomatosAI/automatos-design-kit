name: Kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kit:
    name: Build, lint, typecheck, test, pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Actions are pinned to full commit SHAs. checkout and upload-artifact reuse the
      # pins core already uses; core has no SHA-pinned setup-node, so this pin was
      # resolved here from the v7.1.0 tag (gh api repos/actions/setup-node/git/ref/tags/v7.1.0).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # npm 10 (Node 22's bundled npm) crashes resolving optional peers such as vitest 5's with
      # "Cannot read properties of null (reading 'edgesOut')" (npm/cli#9787); fixed in 11.6.0.
      - name: Pin npm
        run: npm install -g npm@11.21.1

      # PRD-261 C-06r (PB-4): a released theme version never changes. Every folder under themes/ is a theme,
      # released by its <slug>-v<version> tags (the tag rule scripts/release/themes.mjs holds). While a theme's
      # theme.json names a tagged version, its packed paths (theme.json, README.md, CHANGELOG.md and every LICENSE
      # spelling, dist, boot, looks, assets and src under themes/<slug>, and the src of each kit library its
      # package.json names) must be as the tag has them; a change needs a version above every release. Play and
      # HUD bundle packages/look-kit/src and packages/mascot/src; Arcade bundles packages/mascot/src alone, not
      # packages/look-kit/src; HUD's and Arcade's committed boot and looks are among their packed paths. The
      # checkout above fetches no tags, so the script lists origin's <slug>-v* tags for each folder (git
      # ls-remote) and fetches the matching one at depth 1. The kit is public, so it needs no token. Node alone,
      # nothing installed: it runs before the install, so a change to a released theme fails first.
      - name: Check released themes are unchanged
        run: node scripts/release/released-unchanged.mjs

      # Install exactly what package-lock.json records (committed in A-15b from the lockfile the
      # first kit CI run resolved with these exact pins).
      - name: Install (from the lockfile)
        run: npm ci --no-audit --no-fund

      # Each root script runs the same script in every workspace that defines it,
      # packages/* first, then themes/*.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack
        run: npm run pack

      - name: Upload theme packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-themes
          path: |
            **/*.autotheme*
            !**/node_modules/**
          if-no-files-found: error

  # PRD-261 B-02f: each theme drawn in the browser harness (packages/theme-harness), with nothing of Automatos
  # running: Play's build writes its look data (HUD's is committed), then `automatos-theme shots`, once for Play and
  # once for HUD, builds the harness for that theme, serves it on 127.0.0.1:4318 and shoots every slot, page and
  # route the theme serves, for each preset at 1440 and 1024 px and once below its minWidth, on Chromium and WebKit,
  # with an axe scan of each shot. It fails on a missing shot, a request to any other origin, or a critical axe
  # violation. HUD's shots go to their own folder, hud/, beside Play's. Then PRD-261 B-02i's dev smoke:
  # `automatos-theme dev` serves Play's harness and /chat renders. Then the phone view's shots: `automatos-theme dev`
  # over a made-up theme with a `mobile` block, its /phone on three screens, Light and Dark, and the skin designer with
  # a failing pair, each with an axe scan of the phone. Then the showcase shots: chosen views of HUD, Play and Arcade on
  # the hosted edition, at twice the pixel density, on Chromium. Then PRD-261 B-02h's Lighthouse, report only: each theme
  # under themes/ served in turn by `automatos-theme dev` and measured on the same Chromium. The shots, axe.json files
  # and the smoke's shot are uploaded either way as kit-harness, the showcase as kit-showcase, and the Lighthouse
  # reports as kit-lighthouse.
  harness:
    name: Harness shots and axe
    runs-on: ubuntu-latest
    # The shots and the showcase take about 11 minutes; the Lighthouse step has 20 of its own on top.
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pin npm
        run: npm install -g npm@11.21.1

      - name: Install (from the lockfile)
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # The two browsers the shots run on, with their system libraries, at the version @playwright/test pins.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Shots
        run: npx automatos-theme shots themes/play --out packages/theme-harness/dist/shots

      # HUD's, in their own folder of the upload: the harness is rebuilt for HUD (its dist/app only).
      - name: HUD shots
        run: npx automatos-theme shots themes/hud --out packages/theme-harness/dist/shots/hud

      # Every other theme under themes/ (one the kit or a copy of it adds), each in its own folder of the upload, so a
      # new theme is drawn in a browser on every pull request, not only Play and HUD (scripts/shots/other-themes.mjs).
      - name: Other themes' shots
        if: ${{ !cancelled() }}
        run: node scripts/shots/other-themes.mjs

      # PRD-261 B-02i: `automatos-theme dev themes/play` (the smoke config's web server) builds the harness, serves it
      # on 127.0.0.1:4319, and /chat renders there on Chromium; its shot and any trace go to
      # packages/theme-harness/dist/shots/dev-smoke/, so the upload below carries them.
      - name: Dev smoke
        run: npx playwright test --config packages/theme-harness/shots/dev-smoke.config.ts

      # The phone view's shots: `automatos-theme dev packages/theme-harness/fixtures/phone-skin` (the config's web server,
      # on 127.0.0.1:4319 once the smoke's server has stopped), then /phone's Chat, Command Centre and First open in Light
      # and Dark, and the skin designer holding a draft with a failing pair, on Chromium, each with an axe scan of the
      # phone; a critical violation fails it. The shots, axe.json files and any trace go to
      # packages/theme-harness/dist/shots/phone/, so the upload below carries them.
      - name: Phone shots
        run: npx playwright test --config packages/theme-harness/shots/phone-shots.config.ts

      # The showcase: clean images of HUD, Play and Arcade for READMEs, docs, the product site and the listings'
      # previews. Its config serves each theme with `automatos-theme dev` on a port of its own (127.0.0.1:4320, :4321
      # and :4322), then shoots chosen views in chosen
      # looks on the hosted edition (so no first-run nudge), at twice the pixel density, with reduced motion and a fixed
      # clock, on Chromium, with no axe scan (the shots above scan the same views). The PNGs go to
      # packages/theme-harness/dist/showcase/, uploaded as kit-showcase, apart from kit-harness.
      - name: Showcase shots
        run: npx playwright test --config packages/theme-harness/shots/showcase.config.ts

      # PRD-261 B-02h (QB-13c), report only: Lighthouse over every theme under themes/ drawn in the harness
      # (scripts/lighthouse/main.ts). `automatos-theme dev` serves each theme in turn on 127.0.0.1:4322 (Play's look
      # data from the Build step, HUD's committed), and Lighthouse's own command (the root package.json pins it)
      # measures the theme's home view and its /chat page, in its default look with the toolbar off, at 1440 x 900
      # (Lighthouse's desktop preset) and 390 x 844 (its mobile scoring), on the Chromium installed above, headless.
      # The HTML and JSON reports go to packages/theme-harness/dist/lighthouse/, uploaded as kit-lighthouse, and the
      # scores to the job summary as one table. No bar is applied yet. It never fails the build: the script exits 0
      # whatever the scores or a run's failure, and the step continues on an error or its timeout.
      - name: Lighthouse (report only)
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/lighthouse/main.ts

      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-harness
          path: packages/theme-harness/dist/shots/
          if-no-files-found: error

      - name: Upload showcase
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-showcase
          path: packages/theme-harness/dist/showcase/
          if-no-files-found: error

      # Report only, like the step: a run with no report warns and never fails the job.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-lighthouse
          path: packages/theme-harness/dist/lighthouse/
          if-no-files-found: warn

  # PRD-261 B-06a: a proof run's pull request (proof/README.md), from a branch named proof/<id>-<slug> only. The checkout
  # is the pull request's own head with its history, not the merge with main, so the guard sees the proof's diff alone.
  # The guard is main's copy of scripts/proof/guard.mjs (taken from origin/main, so a proof branch can't change the
  # check that judges it), run with --ci and Node alone, before any install: it reads the one proof/<id>/BASE the branch
  # holds, takes the slug from the branch's name (HEAD_REF, passed through the environment, never into the script's
  # text), fetches that base tag and fails on any change outside themes/<slug>/ and proof/<id>/, but the new workspace's
  # lock entries and the launcher's deletion of the leak paths. The kit job above builds, lints, typechecks, tests and
  # packs the new theme with every other workspace (themes/* are workspaces); the harness job shoots Play and HUD by
  # name, so this job runs the server's checks on the new theme and shoots it in the browser harness, its shots and
  # axe.json files uploaded as kit-proof-shots.
  proof:
    name: Proof guard, check and shots
    if: startsWith(github.head_ref, 'proof/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Proof guard
        id: guard
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git show origin/main:scripts/proof/guard.mjs > "$RUNNER_TEMP/proof-guard.mjs"
          node "$RUNNER_TEMP/proof-guard.mjs" --ci

      - name: Pin npm
        run: npm install -g npm@11.21.1

      - name: Install (from the lockfile)
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Proof theme check
        env:
          PROOF_THEME: ${{ steps.guard.outputs.theme }}
        run: npx automatos-theme check "$PROOF_THEME"

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Proof theme shots
        env:
          PROOF_THEME: ${{ steps.guard.outputs.theme }}
        run: npx automatos-theme shots "$PROOF_THEME" --out packages/theme-harness/dist/shots/proof

      - name: Upload proof shots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-proof-shots
          path: packages/theme-harness/dist/shots/proof/
          if-no-files-found: error
