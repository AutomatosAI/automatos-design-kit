name: Theme review

# PRD-261 C-02b (D3, 19 Oct): the isolated review of one Marketplace theme version, run by the
# person reviewing it. It downloads the package, installs the kit from its lockfile with install
# scripts off, then does everything that touches the submission inside `docker run --network none`:
# a no-network probe, core's package checks (the kit's port), the digest against the one the admin
# queue shows, the JS rules on source/, and the reproducible build of source/ with the kit's own
# vite-preset. The job summary holds the text the reviewer pastes into the admin queue's report
# note (POST /api/admin/themes/{id}/report-note) with its outcome. The orchestrator never runs
# this job and never calls GitHub. No secrets, and the token has no permissions.
#
# PRD-261 B-02j: the text ends with a report-only "Previews and accessibility" section (the
# previews per preset, and contrast, which the look schema gives no pairs to measure), and once the
# review has passed, an axe pass over harness shots of the package follows it, outside the
# container. Neither is a check: the outcome is the review's alone, and the person reviewing decides.

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: "HTTPS URL of the version's .autotheme package"
        required: true
        type: string
      expected_digest:
        description: "The package digest the admin queue shows for the version (64 hex characters)"
        required: true
        type: string

permissions: {}

env:
  # The container the submission is handled in. Node 22.18+ runs the kit's TypeScript directly.
  # Pinned by digest (the multi-arch index of the tag, read from the Docker Hub registry, 19 Oct
  # 2026), so a re-pushed tag can't change what runs the review. Bump tag and digest together.
  REVIEW_IMAGE: node:22.18.0-bookworm-slim@sha256:752ea8a2f758c34002a0461bd9f1cee4f9a3c36d48494586f60ffce1fc708e0e

jobs:
  review:
    name: Review a theme version (no network, no secrets)
    runs-on: ubuntu-latest
    # The review takes a few minutes; the axe pass after it has 35 of its own (browsers 10, shots 25).
    timeout-minutes: 50
    steps:
      - name: Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # Same npm pin as kit.yml (npm/cli#9787).
      - name: Pin npm
        run: npm install -g npm@11.21.1

      # The inputs reach the shell through env only, never pasted into the script.
      - name: Download the package
        shell: bash
        env:
          PACKAGE_URL: ${{ inputs.package_url }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          case "$PACKAGE_URL" in https://*) ;; *) echo "::error::package_url must be an https:// URL"; exit 1;; esac
          if ! printf '%s' "$EXPECTED_DIGEST" | grep -Eqx '[0-9a-f]{64}'; then
            echo "::error::expected_digest must be 64 lower-case hex characters"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/review"
          pkg="$RUNNER_TEMP/review/package.autotheme"
          max_bytes=10485760
          # --max-filesize alone does not bind a response with no Content-Length on every curl,
          # so `head` caps what reaches the disk at one byte over the limit, whatever the server sends.
          set +e
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-filesize "$max_bytes" --max-time 120 "$PACKAGE_URL" | head -c "$((max_bytes + 1))" > "$pkg"
          codes=("${PIPESTATUS[@]}")
          set -e
          size=$(stat -c %s "$pkg")
          if [ "$size" -gt "$max_bytes" ] || [ "${codes[0]}" -eq 63 ]; then
            echo "::error::The package is larger than 10 MiB"; exit 1
          fi
          if [ "${codes[0]}" -ne 0 ] || [ "${codes[1]}" -ne 0 ]; then
            echo "::error::The package download failed (curl exit ${codes[0]})"; exit 1
          fi
          sha256sum "$pkg"

      - name: Pull the review image
        run: docker pull "$REVIEW_IMAGE"

      # The kit's own dependencies, exactly as package-lock.json records them, with no install
      # scripts. Nothing from the submission is read before or during this step.
      - name: Install the kit (from the lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Everything after the install runs in a container with no network: the kit read-only, a
      # work folder for the package and the rebuild, and the job summary file. No token, no secret.
      - name: Review (no network)
        env:
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          KIT_COMMIT: ${{ github.sha }}
        run: |
          touch "$GITHUB_STEP_SUMMARY"
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --pids-limit 512 \
            -e HOME=/tmp -e EXPECTED_DIGEST -e KIT_COMMIT \
            -e REVIEW_PACKAGE=/review/package.autotheme -e REVIEW_WORK=/review/work \
            -e REVIEW_SUMMARY=/review-summary.md \
            -v "$GITHUB_WORKSPACE:/kit:ro" -v "$RUNNER_TEMP/review:/review" \
            -v "$GITHUB_STEP_SUMMARY:/review-summary.md" \
            -w /kit "$REVIEW_IMAGE" node scripts/review/main.ts

      # PRD-261 B-02j, report only: the axe pass of the "Previews and accessibility" section, on the
      # runner, outside the container above. The package's own code runs in a browser here, with the
      # runner's network, so only once the review has passed (its JS rules and its reproducible build
      # among the checks): both steps run on success only. scripts/review/axe.ts lays the package out as
      # a theme folder in a work folder of its own (never the review's), draws it with
      # `automatos-theme shots` (Chromium and WebKit, an axe scan of each shot) and appends what axe
      # found to the job summary, after the text to paste. Nothing it finds feeds back into the review:
      # the review step has written its report and outcome, and the person reviewing decides. Each step
      # continues on an error and stops at a timeout of its own, so the job's result is the review's.
      - name: Install browsers for the axe pass (report only)
        if: success()
        continue-on-error: true
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit

      - name: Axe over harness shots of the package (report only)
        if: success()
        continue-on-error: true
        timeout-minutes: 25
        run: |
          REVIEW_PACKAGE="$RUNNER_TEMP/review/package.autotheme" AXE_WORK="$RUNNER_TEMP/review-axe" \
            REVIEW_SUMMARY="$GITHUB_STEP_SUMMARY" node scripts/review/axe.ts
