name: Theme release

# PRD-261 C-06a (PB-6): a kit theme as a GitHub release, from a tag a person pushes. A merge that raises a theme's
# version is released by theme-publish.yml, which also lists it on the hosted Marketplace and signs it, and makes
# the tag itself (a tag made with the run's token starts no workflow, so that release never runs this one). This
# workflow is for a tag pushed by hand: it builds as kit.yml does (its Node and npm pins, the lockfile, the root
# build), with install scripts off, packs the one theme the tag names and releases it, unlisted and unsigned. A
# backfill (theme-publish.yml run by hand with the tag) lists and signs it later and adds its .sig.json to this
# release. The flow around a release: docs/OFFICIAL-LISTING.md.
#
# The theme: a tag <slug>-v<major>.<minor>.<patch> (TAG_PATTERN, the tag rule scripts/release/themes.mjs holds)
# names the folder themes/<slug>. scripts/release/bumped.mjs --tag checks it as theme-publish.yml's backfill does:
# the tag is on main, and theme.json's id is <publisher>/<slug>, with the publisher release/publishers.json lists,
# at the tag's version. "Name the theme" makes the folder, the folder its pack script writes (--out out) and its
# signatures folder from the tag's slug; the package's name (<publisher>.<slug>, the id with its slash as a dot, as
# pack names it) comes from the check. The release's title is theme.json's name and the version.
#
# The release holds <publisher>.<slug>-<v>.autotheme and its .sha256, checked against the zip sha256 pack records
# in its own summary (.sha256.json). If the tagged commit holds themes/<slug>/signatures/<v>.sig.json,
# scripts/sign/verify.ts checks it against the package just built and the release carries it too.
#
# keys/theme-signing.json holds Automatos's theme-signing key. If it holds no active key, no signature can
# verify: a run with one to check stops with that reason and attaches nothing. No secrets: the job uses its own
# token, with contents: write for the release and nothing else. GitHub does not evaluate path filters for tag
# pushes, so every tag that looks like <slug>-v<version> runs the job, and the job refuses one TAG_PATTERN doesn't
# admit.

on:
  push:
    tags: ["*-v*"]

permissions: {}

env:
  # A tag's theme is the folder of its name in here.
  THEMES_DIR: themes
  # Each theme's pack script writes its package into this folder of its own (its package.json: --out out).
  PACK_FOLDER: out
  # Each theme's committed signatures, in this folder of its own, which pack never packs.
  SIGNATURES_FOLDER: signatures
  KEYS_FILE: keys/theme-signing.json
  TAG_PATTERN: '^([a-z0-9-]+)-v[0-9]+\.[0-9]+\.[0-9]+$'

jobs:
  release:
    name: Release a theme from its tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # All history, so the tag's commit can be checked against main.
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # Same npm pin as kit.yml (npm/cli#9787).
      - name: Pin npm
        run: npm install -g npm@11.21.1

      - name: Check the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ $TAG_PATTERN ]]; then
            echo "::error::A release tag is <slug>-v<major>.<minor>.<patch>: lower-case letters, digits and hyphens, then -v and the version"; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG##*-v}" >> "$GITHUB_ENV"

      # Everything else from the tag's slug: the version is what follows its last -v, the slug what comes before.
      - name: Name the theme
        shell: bash
        run: |
          theme="${TAG%-v*}"
          dir="$THEMES_DIR/$theme"
          {
            echo "THEME=$theme"
            echo "THEME_DIR=$dir"
            echo "PACK_DIR=$dir/$PACK_FOLDER"
            echo "SIGNATURES_DIR=$dir/$SIGNATURES_FOLDER"
          } >> "$GITHUB_ENV"

      # The tag rule, as a backfill's tag is held to it (scripts/release/bumped.mjs --tag): the tagged commit is on
      # main, and its themes/<slug>/theme.json is a listed publisher's <publisher>/<slug> at the tag's version. Its
      # package's name is the id with its slash as a dot.
      - name: Check the theme at the tag
        shell: bash
        run: |
          node scripts/release/bumped.mjs --tag "$TAG" > "$RUNNER_TEMP/theme.json"
          echo "PACKAGE_NAME=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].packageName' "$RUNNER_TEMP/theme.json")" >> "$GITHUB_ENV"

      # The kit's own dependencies, exactly as package-lock.json records them, with no install scripts.
      - name: Install (from the lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Pack the theme
        run: npm run pack --workspace "$THEME_DIR"

      # The .sha256 file, held to the zip sha256 pack recorded in its summary.
      - name: Checksum
        shell: bash
        run: |
          base="$PACKAGE_NAME-$VERSION"
          cd "$PACK_DIR"
          summary() { node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[process.argv[2]]' "$base.sha256.json" "$1"; }
          sha256sum "$base.autotheme" > "$base.autotheme.sha256"
          actual=$(cut -d ' ' -f 1 "$base.autotheme.sha256")
          if [ "$actual" != "$(summary zipSha256)" ]; then
            echo "::error::$base.autotheme's sha256 differs from the one pack recorded in $base.sha256.json"; exit 1
          fi
          echo "PACKAGE_SHA256=$actual" >> "$GITHUB_ENV"
          echo "PACKAGE_DIGEST=$(summary digest)" >> "$GITHUB_ENV"

      - name: Find a signature at the tag
        id: signature
        shell: bash
        run: |
          sig="$SIGNATURES_DIR/$VERSION.sig.json"
          if [ -f "$sig" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "SIGNATURE=$sig" >> "$GITHUB_ENV"
            echo "KEYS=$KEYS_FILE" >> "$GITHUB_ENV"
          else
            echo "::notice::No $sig at the tag: the release goes out unsigned; theme-publish.yml run by hand with this tag lists it, signs it and adds its .sig.json"
          fi

      - name: Check a signing key is published
        if: steps.signature.outputs.found == 'true'
        shell: bash
        run: |
          active=$(node -p 'const held = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).keys; Array.isArray(held) ? held.filter((key) => key !== null && key.status === "active").length : 0' "$KEYS" 2> /dev/null) || {
            echo "::error::$KEYS_FILE can't be read as a keys file, so no signature can be verified and none is attached"; exit 1; }
          if [ "$active" -eq 0 ]; then
            echo "::error::No signing key yet: $KEYS_FILE holds no active key, so no signature can be verified and none is attached. Publish the production key's public half there first (a pull request to main)."
            exit 1
          fi
          echo "$KEYS_FILE holds $active active signing key(s)."

      - name: Verify the signature
        if: steps.signature.outputs.found == 'true'
        run: node scripts/sign/verify.ts "$PACK_DIR/$PACKAGE_NAME-$VERSION.autotheme" "$SIGNATURE" "$KEYS"

      # The title is theme.json's name and the version: "Play 1.1.1", "HUD 1.0.0". The notes end with the pictures
      # theme.json lists under previews, each shown from the tag (scripts/release/preview-notes.ts).
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base="$PACK_DIR/$PACKAGE_NAME-$VERSION"
          assets=("$base.autotheme" "$base.autotheme.sha256")
          if [ -n "${SIGNATURE:-}" ]; then assets+=("$SIGNATURE"); fi
          title="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).name' "$THEME_DIR/theme.json") $VERSION"
          notes="$title. A local edition installs it with Settings › Appearance › Themes › Install theme. Package digest (the one an admin queue shows): $PACKAGE_DIGEST. sha256 of the .autotheme file: $PACKAGE_SHA256."
          previews="$(node scripts/release/preview-notes.ts "$THEME_DIR" "$TAG" "$GH_REPO")"
          if [ -n "$previews" ]; then notes="$notes"$'\n\n'"$previews"; fi
          gh release create "$TAG" "${assets[@]}" --verify-tag --title "$title" --notes "$notes"
